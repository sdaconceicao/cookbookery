name: cookbookery

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cookbookery
      POSTGRES_USER: cookbookery
      POSTGRES_PASSWORD: cookbookery
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/001-citext.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
