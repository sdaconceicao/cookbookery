name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Quality, Types, Tests, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24.x"
          cache: pnpm

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Quality
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: pnpm check

      - name: Types
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: pnpm typecheck

      - name: Tests
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: pnpm test:coverage

      - name: Build
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: pnpm build
